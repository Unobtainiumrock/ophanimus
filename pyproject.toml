[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ophanimus"
version = "0.2.0"
description = "Riemannian manifold primitives and geodesic algorithms"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Nicholas Fleischhauer"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["riemannian", "manifold", "hyperbolic", "geodesic", "embedding", "poincare", "lorentz"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["ruff", "mypy", "build", "twine"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Unobtainiumrock/ophanimus"
Repository = "https://github.com/Unobtainiumrock/ophanimus"
Issues = "https://github.com/Unobtainiumrock/ophanimus/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
